
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة صانع التطبيقات الذكي</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101827;
  color:white;
  text-align:center;
}
header{
  padding:35px 15px;
  background:#172b46;
}
h1{color:#54d6c5}
main{
  padding:25px 15px;
  max-width:750px;
  margin:auto;
}
.card{
  background:#1c2c42;
  padding:22px;
  border-radius:16px;
  margin:18px 0;
}
textarea{
  width:100%;
  height:150px;
  padding:15px;
  border-radius:10px;
  font-size:16px;
  direction:rtl;
}
button{
  background:#12b9a5;
  border:0;
  padding:14px 25px;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  margin-top:15px;
  cursor:pointer;
}
button:disabled{opacity:.5}
#result{
  text-align:right;
  line-height:1.9;
  overflow-wrap:anywhere;
}
#result h3{color:#54d6c5}
footer{padding:25px;color:#aab}
</style>
</head>

<body>

<header>
<h1>صانع التطبيقات الذكي</h1>
<p>أنشئ تطبيقك الخاص بمساعدة الذكاء الاصطناعي</p>
</header>

<main>

<div class="card">
<h2>🚀 ابدأ مشروعك</h2>
<p>اكتب وصف التطبيق الذي تريد إنشاءه:</p>

<textarea id="prompt"
placeholder="مثال: أريد إنشاء تطبيق لإدارة المستشفى..."></textarea>

<button id="createBtn" onclick="generate()">
إنشاء المشروع
</button>
</div>

<div class="card" id="result">
<h3>مساحة المشروع</h3>
<p>سيظهر مشروعك هنا.</p>
</div>

</main>

<footer>منصة صانع التطبيقات الذكي © 2026</footer>

<script>


const API_URL =
  "https://ai-app-engine-2.mohammed94tv94.workers.dev/generate";

async function generateApp() {
  const promptInput = document.querySelector(
    "#prompt, #description, textarea, input[type='text']"
  );

  if (!promptInput || !promptInput.value.trim()) {
    alert("يرجى كتابة وصف التطبيق أولاً");
    return;
  }

  const button = document.querySelector(
    "#generateBtn, #generateButton, button[type='submit']"
  );

  const originalText = button ? button.textContent : "";

  try {
    if (button) {
      button.disabled = true;
      button.textContent = "جاري إنشاء التطبيق...";
    }

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: promptInput.value.trim()
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "حدث خطأ في الاتصال بالمحرك");
    }

    const result = data.result || data.text;

    if (!result) {
      throw new Error("لم تصل نتيجة من Gemini");
    }

    let output = document.querySelector(
      "#result, #output, #generatedResult"
    );

    if (!output) {
      output = document.createElement("div");
      output.id = "generatedResult";
      output.style.cssText =
        "white-space:pre-wrap;padding:20px;margin:20px 0;border-radius:12px;background:#f1f5f9;color:#111827;direction:rtl;";
      document.body.appendChild(output);
    }

    output.textContent = result;

  } catch (error) {
    alert("تعذر إنشاء المشروع: " + error.message);
  } finally {
    if (button) {
      button.disabled = false;
      button.textContent = originalText;
    }
  }
}


</script>

</body>
</html>
