
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة صانع التطبيقات الذكي</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#101827;color:white;text-align:center}
header{padding:35px 15px;background:#172b46}
h1{color:#54d6c5}
main{padding:25px 15px;max-width:650px;margin:auto}
.card{background:#1c2c42;padding:22px;border-radius:16px;margin:18px 0}
textarea{width:100%;height:150px;padding:15px;border-radius:10px;font-size:16px;direction:rtl}
button{background:#12b9a5;border:0;padding:14px 25px;border-radius:10px;font-size:17px;font-weight:bold;margin-top:15px;cursor:pointer}
button:active{opacity:.7}
footer{padding:25px;color:#aab}
</style>
</head>
<body>
<header>
<h1>صانع التطبيقات الذكي</h1>
<p>أنشئ تطبيقك الخاص بمساعدة الذكاء الاصطناعي</p>
</header>

<main>
<div class="card">
<h2>🚀 ابدأ مشروعك</h2>
<p>اكتب وصف التطبيق الذي تريد إنشاءه:</p>
<textarea id="prompt" placeholder="مثال: أريد إنشاء تطبيق لإدارة المستشفى..."></textarea>
<button id="createBtn" onclick="generate()">إنشاء المشروع</button>
</div>

<div class="card" id="result">
<h3>مساحة المشروع</h3>
<p>سيظهر وصف مشروعك هنا.</p>
</div>
</main>

<footer>منصة صانع التطبيقات الذكي © 2026</footer>

<script>
function generate(){
const promptText=document.getElementById("prompt").value.trim();
const result=document.getElementById("result");

if(!promptText){
alert("يرجى كتابة وصف التطبيق أولاً");
return;
}

const project={
id:"APP-"+Date.now(),
description:promptText,
platform:"Android",
status:"Draft"
};

localStorage.setItem("myProject",JSON.stringify(project));

result.innerHTML="";
const title=document.createElement("h3");
title.textContent="🎉 تم إنشاء المشروع بنجاح";

const description=document.createElement("p");
description.textContent=project.description;

const platform=document.createElement("p");
platform.textContent="المنصة: Android";

const status=document.createElement("p");
status.textContent="الحالة: مسودة";

const id=document.createElement("p");
id.textContent="رقم المشروع: "+project.id;

result.append(title,description,platform,status,id);
}

async function generate() {
  const promptText = document.getElementById("prompt").value.trim();
  const result = document.getElementById("result");
  const button = document.getElementById("createBtn");

  if (!promptText) {
    alert("يرجى كتابة وصف التطبيق أولاً");
    return;
  }

  button.disabled = true;
  button.textContent = "جاري بناء التطبيق بالذكاء الاصطناعي...";
  result.textContent = "يرجى الانتظار، يتم تحليل فكرتك الآن...";

  try {
    const response = await fetch(
      "https://ai-app-engine-2.mohammed94tv94.workers.dev",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          prompt: promptText
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(
        data.message + (data.details ? ": " + data.details : "")
      );
    }

    const project = data.project;

    result.innerHTML = "";

    function addText(title, value) {
      if (!value) return;

      const heading = document.createElement("h3");
      heading.textContent = title;

      const content = document.createElement("div");

      if (Array.isArray(value)) {
        const list = document.createElement("ul");
        value.forEach(item => {
          const li = document.createElement("li");
          li.textContent = typeof item === "object"
            ? JSON.stringify(item)
            : String(item);
          list.appendChild(li);
        });
        content.appendChild(list);
      } else {
        content.textContent = typeof value === "object"
          ? JSON.stringify(value, null, 2)
          : String(value);
      }

      result.append(heading, content);
    }

    addText("🎉 " + (project.appName || "تم إنشاء مشروعك"), "");
    addText("📱 وصف التطبيق", project.description);
    addText("📄 شاشات التطبيق", project.screens);
    addText("⚙️ المميزات", project.features);
    addText("🧭 التنقل بين الأقسام", project.navigation);
    addText("🎨 التصميم", project.design);
    addText("🛠️ الخطة التقنية", project.technicalPlan);

    const projectId = "APP-" + Date.now();

    localStorage.setItem("myProject", JSON.stringify({
      id: projectId,
      prompt: promptText,
      project: project
    }));

    addText("رقم المشروع", projectId);
    addText("الحالة", "تم إنشاء مخطط المشروع بنجاح");

  } catch (error) {
    result.textContent = "تعذر إنشاء المشروع: " + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "إنشاء المشروع";
  }
}

</body>
</html>
