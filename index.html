
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة صانع التطبيقات الذكي</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101827;
  color:white;
  text-align:center;
}
header{
  padding:35px 15px;
  background:#172b46;
}
h1{color:#54d6c5}
main{
  padding:25px 15px;
  max-width:750px;
  margin:auto;
}
.card{
  background:#1c2c42;
  padding:22px;
  border-radius:16px;
  margin:18px 0;
}
textarea{
  width:100%;
  height:150px;
  padding:15px;
  border-radius:10px;
  font-size:16px;
  direction:rtl;
}
button{
  background:#12b9a5;
  border:0;
  padding:14px 25px;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  margin-top:15px;
  cursor:pointer;
}
button:disabled{opacity:.5}
#result{
  text-align:right;
  line-height:1.9;
  overflow-wrap:anywhere;
}
#result h3{color:#54d6c5}
footer{padding:25px;color:#aab}
</style>
</head>

<body>

<header>
<h1>صانع التطبيقات الذكي</h1>
<p>أنشئ تطبيقك الخاص بمساعدة الذكاء الاصطناعي</p>
</header>

<main>

<div class="card">
<h2>🚀 ابدأ مشروعك</h2>
<p>اكتب وصف التطبيق الذي تريد إنشاءه:</p>

<textarea id="prompt"
placeholder="مثال: أريد إنشاء تطبيق لإدارة المستشفى..."></textarea>

<button id="createBtn" onclick="generate()">
إنشاء المشروع
</button>
</div>

<div class="card" id="result">
<h3>مساحة المشروع</h3>
<p>سيظهر مشروعك هنا.</p>
</div>

</main>

<footer>منصة صانع التطبيقات الذكي © 2026</footer>

<script>



async function generate() {
  const promptText = document.getElementById("prompt").value.trim();
  const result = document.getElementById("result");
  const button = document.getElementById("createBtn");

  if (!promptText) {
    alert("يرجى كتابة وصف التطبيق أولاً");
    return;
  }

  button.disabled = true;
  button.textContent = "جاري إنشاء المشروع...";
  result.textContent = "🤖 يتصل بمحرك الذكاء الاصطناعي...";

  try {
    const response = await fetch(
      "https://ai-app-engine-2.mohammed94tv94.workers.dev/generate",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          prompt: promptText
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(
        data.error || data.message || "فشل الاتصال بـ Gemini"
      );
    }

    const answer = data.result || data.text;

    if (!answer) {
      throw new Error("لم تصل إجابة من Gemini");
    }

    result.innerHTML = "";

    const heading = document.createElement("h3");
    heading.textContent = "🎉 نتيجة إنشاء المشروع";

    const content = document.createElement("pre");
    content.textContent = answer;
    content.style.cssText =
      "white-space:pre-wrap;overflow-wrap:anywhere;direction:rtl;text-align:right;font-family:Arial;line-height:1.9;";

    result.appendChild(heading);
    result.appendChild(content);

    const projectId = "APP-" + Date.now();

    localStorage.setItem("myProject", JSON.stringify({
      id: projectId,
      prompt: promptText,
      result: answer,
      createdAt: new Date().toISOString()
    }));

  } catch (error) {
    result.innerHTML = "";

    const heading = document.createElement("h3");
    heading.textContent = "تعذر إنشاء المشروع";

    const message = document.createElement("p");
    message.textContent = error.message;

    result.append(heading, message);

  } finally {
    button.disabled = false;
    button.textContent = "إنشاء المشروع";
  }
}



</script>

</body>
</html>
